name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Typecheck, lint, unit tests ─────────────────────────────────────────
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (api)
        run: npm run typecheck:api

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

  # ── 2. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GROQ_API_KEY: ci-placeholder
          VITE_OPENROUTER_API_KEY: ci-placeholder
          VITE_OPENROUTER_MODEL: qwen/qwen3-235b-a22b:free

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # ── 3. Link check ───────────────────────────────────────────────────────────
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check internal links
        run: node scripts/check-links.mjs
